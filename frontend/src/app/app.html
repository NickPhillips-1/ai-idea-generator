@if (workspace()) {
<header class="top">
  <div class="account">
    @if (account(); as person) {
      <button
        type="button"
        class="profile"
        [attr.aria-label]="person.name"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-controls]="menuOpen() ? 'account-menu' : null"
        aria-haspopup="menu"
        (click)="toggleMenu($event)"
      >
        @if (person.pictureUrl && !pictureFailed()) {
          <img
            [src]="person.pictureUrl"
            alt=""
            referrerpolicy="no-referrer"
            (error)="pictureFailed.set(true)"
          />
        } @else if (initials(person.name)) {
          <span class="initials" aria-hidden="true">{{ initials(person.name) }}</span>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="9" r="3.25" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path
              d="M5.8 18.4a6.4 6.4 0 0 1 12.4 0"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        }
      </button>
      @if (menuOpen()) {
        <div
          class="menu"
          id="account-menu"
          role="menu"
          aria-label="Account"
          (click)="$event.stopPropagation()"
        >
          <div class="who">
            <span class="who-name">{{ person.name }}</span>
            @if (person.email !== person.name) {
              <span class="who-email">{{ person.email }}</span>
            }
          </div>
          <button
            type="button"
            class="logout"
            role="menuitem"
            (click)="logout($event)"
            [disabled]="loggingOut()"
            [attr.aria-busy]="loggingOut() ? true : null"
          >
            @if (loggingOut()) {
              <span class="spin" aria-hidden="true"></span>
            }
            Log out
          </button>
        </div>
      }
    } @else if (sessionReady()) {
      <a class="sign-in" routerLink="/login">Sign in</a>
    }
  </div>
</header>
}
<main [class.gate]="!workspace()">
  @if (!workspace()) {
    <span class="product-name gate-mark">Founders</span>
  }
  <router-outlet />
</main>
