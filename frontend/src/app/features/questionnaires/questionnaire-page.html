<section>
  <h1>Questionnaire</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Interests <textarea formControlName="interests"></textarea></label>
    <label>Skills <textarea formControlName="skills"></textarea></label>
    <label>Resources <textarea formControlName="resources"></textarea></label>
    <label>Goals <textarea formControlName="goals"></textarea></label>
    <button type="submit">Submit questionnaire</button>
  </form>
  @if (savedId(); as id) {
    <p>Submitted questionnaire {{ id }}.</p>
    <a routerLink="/alignments">Continue to alignment</a>
  }
  @if (errorMessage(); as message) {
    <p>{{ message }}</p>
  }
</section>
