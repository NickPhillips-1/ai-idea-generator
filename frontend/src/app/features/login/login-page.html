<section class="signin">
  <h1>Welcome to Founders</h1>
  @if (denied) {
    <p class="alert">This account cannot open the workspace.</p>
  }
  @if (failed()) {
    <p class="alert">That username or password is wrong.</p>
  }
  <form (submit)="signIn($event)">
    <label>
      Username
      <input
        name="username"
        autocomplete="username"
        [value]="username()"
        (input)="username.set(valueOf($event))"
        required
      />
    </label>
    <label>
      Password
      <input
        name="password"
        type="password"
        autocomplete="current-password"
        [value]="password()"
        (input)="password.set(valueOf($event))"
        required
      />
    </label>
    <button type="submit" [disabled]="signingIn()" [attr.aria-busy]="signingIn() ? true : null">
      @if (signingIn()) {
        <span class="spin" aria-hidden="true"></span>
      }
      Sign in
    </button>
  </form>
</section>
