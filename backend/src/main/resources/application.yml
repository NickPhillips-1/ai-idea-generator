spring:
  application:
    name: founders-lab
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${AI_API_KEY:}
      chat:
        model: ${AI_MODEL:gpt-5-mini}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/founderslab}
    username: ${POSTGRES_USER:founderslab}
    password: ${POSTGRES_PASSWORD:founderslab}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        name: FOUNDERSLAB_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax

founderslab:
  auth:
    email-allowlist: ${FOUNDER_EMAIL_ALLOWLIST:}
  e2e:
    login-enabled: ${FOUNDERSLAB_E2E_LOGIN:false}
    fixtures: ${FOUNDERSLAB_E2E_FIXTURES:false}
  research:
    max-jobs-per-hour: ${FOUNDERSLAB_MAX_JOBS_PER_HOUR:30}
    max-estimated-cost: ${FOUNDERSLAB_MAX_ESTIMATED_COST:25}
  rate-limit:
    requests-per-minute: ${FOUNDERSLAB_RATE_LIMIT_PER_MINUTE:600}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
