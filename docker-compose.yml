services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-founderslab}
      POSTGRES_USER: ${POSTGRES_USER:-founderslab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-founderslab}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-founderslab} -d ${POSTGRES_DB:-founderslab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-founderslab}
      POSTGRES_USER: ${POSTGRES_USER:-founderslab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-founderslab}
      FOUNDER_EMAIL_ALLOWLIST: ${FOUNDER_EMAIL_ALLOWLIST:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      CENSUS_API_KEY: ${CENSUS_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FOUNDERSLAB_E2E_LOGIN: ${FOUNDERSLAB_E2E_LOGIN:-false}
      FOUNDERSLAB_E2E_FIXTURES: ${FOUNDERSLAB_E2E_FIXTURES:-false}
      QUESTIONNAIRES_DIR: /questionaires
    volumes:
      - ./questionaires:/questionaires:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - |
        set -e
        npm install --legacy-peer-deps
        cpu=$$(uname -m)
        case "$$cpu" in
          aarch64|arm64) cpu=arm64 ;;
          x86_64) cpu=x64 ;;
        esac
        install_binding() {
          spec="$$1"
          dest="$$2"
          file=$$(npm pack "$$spec" --pack-destination /tmp | tail -n 1)
          mkdir -p "$$dest"
          tar -xzf "/tmp/$$file" -C "$$dest" --strip-components=1
        }
        install_binding "@rolldown/binding-linux-$${cpu}-musl@1.2.19" "node_modules/vite/node_modules/@rolldown/binding-linux-$${cpu}-musl"
        install_binding "@rolldown/binding-linux-$${cpu}-musl@1.2.16" "node_modules/@rolldown/binding-linux-$${cpu}-musl"
        install_binding "@oxc-parser/binding-linux-$${cpu}-musl@0.156.0" "node_modules/@oxc-parser/binding-linux-$${cpu}-musl"
        install_binding "lightningcss-linux-$${cpu}-musl@1.33.0" "node_modules/lightningcss-linux-$${cpu}-musl"
        npx ng serve --host 0.0.0.0 --port 4200 --poll 2000
    volumes:
      - ./frontend:/app
      - ./questionaires:/app/public/questionaires:ro
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  proxy:
    image: caddy:2
    ports:
      - "${FOUNDERS_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend

volumes:
  frontend_node_modules:
